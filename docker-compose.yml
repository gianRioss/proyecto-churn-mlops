services:
  churn-api:
    build: .
    container_name: churn_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  streamlit:
    build: .
    container_name: churn_streamlit
    ports:
      - "8501:8501"
    environment:
      API_URL: http://churn-api:8000
    command:
      - python
      - -m
      - streamlit
      - run
      - src/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    depends_on:
      churn-api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      churn-api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana_data: